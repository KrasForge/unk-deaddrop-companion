title: Possible UNK DeadDrop Collection Argument in Editor Process
id: d8e6a892-db53-45fd-8d78-8354738b2d2e
status: experimental
description: Detects Code.exe or Cursor.exe process creation with either collection argument recovered from the Windows pipelines. Process telemetry does not expose ELECTRON_RUN_AS_NODE, so this is a lead for review rather than proof of Node mode.
author: UNK_DeadDrop research contributors
date: 2026-10-25
modified: 2026-10-26
references:
  - 'https://attack.mitre.org/techniques/T1218/015/'
  - 'https://krasforge.github.io/UNK_DeadDrop/articles/02-vsix-editor-execution/'
tags:
  - attack.stealth
  - attack.t1218.015
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\Code.exe'
      - '\Cursor.exe'
  selection_argument:
    CommandLine|contains:
      - '--company-wallet-job'
      - '--win-build-ep-only'
  condition: selection_image and selection_argument
falsepositives:
  - Authorized research or simulations that reproduce the exact collection arguments
level: high
