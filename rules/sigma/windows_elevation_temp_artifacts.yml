title: Possible UNK DeadDrop Temporary Elevation Artifact
id: 4477fbbc-1c53-49ff-bdfc-612f4685fbbb
status: experimental
description: Detects temporary script and completion-sentinel names generated by the recovered Windows elevation paths.
author: UNK_DeadDrop research contributors
date: 2026-10-25
tags:
  - attack.privilege-escalation
  - attack.t1548.002
logsource:
  product: windows
  category: file_event
detection:
  selection_phase_script:
    TargetFilename|contains: '\gus-phase2-'
    TargetFilename|endswith: '.ps1'
  selection_elevation_sentinel:
    TargetFilename|contains: '\sa-elev-done-'
    TargetFilename|endswith: '.txt'
  condition: selection_phase_script or selection_elevation_sentinel
falsepositives:
  - Authorized research or simulations recreating the artifact names
level: medium
