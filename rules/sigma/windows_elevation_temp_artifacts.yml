title: Possible UNK DeadDrop Temporary Elevation Artifact
id: 4477fbbc-1c53-49ff-bdfc-612f4685fbbb
status: experimental
description: Matches file-event paths containing temporary script or completion-sentinel names emitted by the recovered Windows elevation paths. A path match does not establish file creation or successful elevation.
author: UNK_DeadDrop research contributors
date: 2026-10-25
modified: 2026-10-26
references:
  - 'https://attack.mitre.org/techniques/T1548/002/'
  - 'https://krasforge.github.io/UNK_DeadDrop/articles/02-vsix-editor-execution/'
tags:
  - attack.privilege-escalation
  - attack.t1548.002
logsource:
  product: windows
  category: file_event
detection:
  selection_phase_script:
    TargetFilename|contains: '\gus-phase2-'
    TargetFilename|endswith: '.ps1'
  selection_elevation_sentinel:
    TargetFilename|contains: '\sa-elev-done-'
    TargetFilename|endswith: '.txt'
  condition: selection_phase_script or selection_elevation_sentinel
falsepositives:
  - Authorized research or simulations recreating the artifact names
level: medium
