title: Possible UNK DeadDrop Capture Agent Scheduled Task Creation
id: 954827a6-d41a-4f57-b09d-f1490fd886cd
status: experimental
description: Detects schtasks.exe command lines that contain the /create switch and the task-name string recovered from the Windows installer. Substring matching can also match longer task names; API or COM registration is not covered.
author: UNK_DeadDrop research contributors
date: 2026-10-21
modified: 2026-10-26
references:
  - 'https://attack.mitre.org/techniques/T1053/005/'
  - 'https://krasforge.github.io/UNK_DeadDrop/articles/05-screen-capture-analysis/'
tags:
  - attack.persistence
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\schtasks.exe'
    CommandLine|contains|all:
      - '/create'
      - 'GoogleUpdateSupporterNode'
  condition: selection
falsepositives:
  - Security exercises or test installations recreating the artifact
level: medium
