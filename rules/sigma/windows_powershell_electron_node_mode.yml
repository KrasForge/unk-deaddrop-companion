title: Possible UNK DeadDrop PowerShell References Electron Node Mode and Collection Job
id: f24aa88c-0468-43c1-aba6-c3dfa256ca23
status: experimental
description: Detects PowerShell script-block text containing the Electron Node-mode variable and a recovered collection argument. The string match does not establish that the variable was set to 1 or that the command ran.
author: UNK_DeadDrop research contributors
date: 2026-10-25
modified: 2026-10-26
references:
  - 'https://attack.mitre.org/techniques/T1218/015/'
  - 'https://krasforge.github.io/UNK_DeadDrop/articles/02-vsix-editor-execution/'
tags:
  - attack.execution
  - attack.stealth
  - attack.t1059.001
  - attack.t1218.015
logsource:
  product: windows
  category: ps_script
detection:
  selection_mode:
    ScriptBlockText|contains: 'ELECTRON_RUN_AS_NODE'
  selection_argument:
    ScriptBlockText|contains:
      - '--company-wallet-job'
      - '--win-build-ep-only'
  condition: selection_mode and selection_argument
falsepositives:
  - Authorized research or simulations that reproduce both strings
level: high
